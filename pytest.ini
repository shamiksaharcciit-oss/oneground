[pytest]
# `live` marks the one test that calls the real RunPod API. It is read-only and
# creates nothing, but it needs RUNPOD_API_KEY and a network, so it is not part
# of a default offline run:
#
#     pytest -m "not live"     unit tests only
#     pytest -m live           the live read-only plan
markers =
    live: touches the real RunPod API (read-only; skipped without RUNPOD_API_KEY)
