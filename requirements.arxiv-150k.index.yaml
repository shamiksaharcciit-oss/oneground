# oneground requirements — the arxiv-150k fixture, measured through the
# product path.
#
# This file exists to compare two paths that have never been compared: the
# fixture builder (corpora/run_arxiv_150k.sh -> oneground.fixture.build) and
# `oneground characterize`. Both should produce the same five values from the
# same vectors, because after task 007 they call the same measures.
#
# It points at the release asset, which is NOT in the repository — the three
# large artifacts are published separately and extracted locally:
#
#     ~/oneground-assets/arxiv-150k\
#         vectors.npy         (150000, 768) float32   460,800,128 bytes
#         queries.npy         (2000, 768)   float32     6,144,128 bytes
#         sample.jsonl.zst    the source records       49,920,799 bytes
#
# base_meta.parquet and queries_meta.parquet are derived from
# sample.jsonl.zst by tasks/scratch/007-arxiv-metadata.py — a format
# conversion of the `update_date` column, not a recomputed measurement. The
# fixture keeps its metadata inside the compressed sample; the product path
# reads a columnar sidecar, which is what a user would have.

oneground: 1

run:
  name: 034-index-arxiv-150k
  mode: measure
  # The fixture's own sampling seed. `characterize` uses it for the k-means,
  # the LID subsample and (were it downsampling) the draw — the same three
  # places oneground.fixture.build uses spec.sampling.seed.
  seed: 20260908
  workdir: ./runs/034-index-arxiv-150k

corpus:
  sample:
    kind: receipt

    vectors:
      path: ~/oneground-assets/arxiv-150k/vectors.npy
      # The builder normalized at embed time (normalize_embeddings=True), so
      # these are already unit vectors. Saying so avoids a second
      # normalization pass over 460 MB that would change nothing.
      normalized: true

    metadata:
      path: ~/oneground-assets/arxiv-150k/base_meta.parquet
      timestamp_field: update_date
      category_field: category
      # The fixture's drift definition trains the centroids on records before
      # 2019-01-01. Given explicitly rather than left to the median, because
      # the point of this run is to compare against a published value that was
      # measured at this cutoff.
      timestamp_cutoff: "2019-01-01"

    queries:
      path: ~/oneground-assets/arxiv-150k/queries.npy
      count_min: 50
      source: written
      metadata:
        path: ~/oneground-assets/arxiv-150k/queries_meta.parquet
        timestamp_field: update_date

    sampling:
      method: stratified
      stratify_by: update_date
      full_corpus_size: 2100000

    # The whole corpus: no subsampling, so the comparison is against the same
    # 150,000 vectors the fixture measured rather than a draw from them.
    target_sample_size: 150000

# ------------------------------------------------------------------
# simulate -- four index algorithms across the three families (task 034)
# ------------------------------------------------------------------
# The partition of each family is held at the configuration the fixture
# publishes, and only the index algorithm varies. That is what makes the
# routing-loss column a check rather than a number: routing loss is a
# property of the partition, so the four rows of a family must agree on it,
# and a disagreement would be a defect in the decomposition rather than a
# finding about an algorithm.
#
# The HNSW rows are the published reference configurations, unchanged and
# unlabelled by `index` -- which is the other thing this run proves.
#
# Knob choices, and why these:
#   nlist is per index, and for a sharded family that means per shard.
#   single_node_hnsw trains 1024 cells over 150,000 vectors;
#   semantic_sharded's 256 regions hold a few thousand each after the
#   epsilon closure, so 64; hash_sharded's three shards hold 50,000 each,
#   so 256.
#   m = 16 over dimension 768 gives 48 dimensions per sub-quantiser; the
#   dimension must divide by m. nbits = 8 is 256 PQ centroids, which needs
#   at least that many training points in every shard -- the smallest here
#   holds thousands.
simulate:
  kind: declared
  families: [single_node_hnsw, semantic_sharded, hash_sharded]
  node_counts: [3]
  ground_truth_k: 100

  grid:
    single_node_hnsw:
      index: [flat, hnsw, ivf, ivf_pq]
      M: [32]
      efSearch: [128]
      nlist: [1024]
      nprobe: [8]
      m: [16]
      nbits: [8]
    semantic_sharded:
      index: [flat, hnsw, ivf, ivf_pq]
      centroids: [256]
      epsilon: [0.2]
      probe: [2]
      M: [32]
      efSearch: [96]
      nlist: [64]
      nprobe: [4]
      m: [16]
      nbits: [8]
    hash_sharded:
      index: [flat, hnsw, ivf, ivf_pq]
      shards: [3]
      M: [32]
      efSearch: [96]
      nlist: [256]
      nprobe: [8]
      m: [16]
      nbits: [8]

  budget:
    # A guard, not a plan. Twelve configurations on a 7.6 GB laptop, four of
    # which rebuild 256 shards apiece. If this trips, the run says which
    # configurations were not measured rather than pretending it was complete.
    max_minutes: 240
