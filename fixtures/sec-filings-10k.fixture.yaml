# Per corpus, BEFORE any chunking: the baseline every chunking measure must be
# read against. See oneground/measures/duplicates.py.
near_duplicates:
  measure: lexical Jaccard over 5-word shingles, exact on LSH candidates
  why_not_cosine: >
    docs/CHUNKING.md defines near-duplicate rate on chunk vectors at a cosine
    threshold, and task 031 will use it. It cannot be the baseline those
    comparisons are read against: a chunk vector exists only once a chunking
    has been chosen, so a duplicate rate computed from chunk vectors already
    contains the strategy under test. This measure depends on no embedding
    model and no chunk size. It is reported as a lexical rate and never
    converted into a cosine one.
  shingle_words: 5
  num_perm: 128
  bands: 32
  rows: 4
  seed: 20260919
  thresholds: [0.50, 0.60, 0.70, 0.80, 0.90]
  primary_threshold: 0.80
  thresholds_note: >
    The range was fixed from a pilot before the build, so that no cutoff could
    be moved afterwards to suit a result. Three filers' consecutive 10-Ks
    (Nicholas Financial, Medallion Financial, Henry Schein) score Jaccard 0.49
    to 0.62 between adjacent years and 0.34 to 0.50 two years apart, so this
    corpus's repetition is massive and sits below 0.80; reporting only high
    cutoffs would have reported no duplication at all. The pilot is three
    companies and is not the rate.
  exactness: >
    MinHash with LSH banding proposes candidate pairs and exact Jaccard scores
    every candidate; only exact scores are reported. LSH proposes a true pair
    with probability 1.000 at 0.80 and 0.874 at 0.50, so rows below 0.999
    recall are published as a lower bound with the recall beside them, never
    rounded up to a rate.
  candidate_pairs: 14646
  rate_by_threshold:
    '0.50': {rate: 0.5628, documents: 5628, pairs: 4039, kind: lower bound}
    '0.60': {rate: 0.3673, documents: 3673, pairs: 2493, kind: lower bound}
    '0.70': {rate: 0.1431, documents: 1431, pairs: 962, kind: exact}
    '0.80': {rate: 0.0431, documents: 431, pairs: 290, kind: exact}
    '0.90': {rate: 0.0043, documents: 43, pairs: 27, kind: exact}
  kind: receipt

queries:
  count: 2000
  rule: >
    2,000 chunks held out from the sample before ground truth and used as
    queries against the remaining base: 1,000 drawn uniformly and 1,000 drawn
    from the Items that carry the most chunks, so query skew mirrors corpus
    skew, exactly as in the other two fixtures.

    One consequence of applying that rule unchanged here is stated rather than
    designed around. "The top 5% of categories by volume" over arXiv's ~150
    subject classes selects seven; over this corpus's 23 Items it selects
    ONE. So half the queries come from a single Item, and it is whichever
    section is longest. The rule is kept identical because comparability with
    the other two fixtures is what makes the three readable together, and
    changing a constant for one corpus after seeing what it selects is the
    fitting this fixture exists to avoid.

    Measured: the hot Item is 1A, Risk Factors, at 25.0% of sampled chunks.
    The spec predicted Item 8, the financial statements, and was wrong --
    Item 8's tables are dropped by the extraction rule while Item 1A is all
    prose. The prediction is left on the record in `findings` rather than
    quietly corrected.

    This differs from arxiv-150k and stackexchange-150k, where the query is
    the record's title and so is much shorter than the document, and the
    difference is stated rather than hidden: a 10-K has no title-like field,
    and manufacturing a short query for each chunk would need a model, which
    would put a model inside the fixture's ground truth. Queries here are
    therefore the same length as base records. This is chunk-to-chunk
    self-retrieval, the construction docs/CHUNKING.md calls path B, and it
    measures retrievability rather than answer-bearing search.
  seed: 20260920
  queries_sha256: 6f1d041a028744c959681041d90fa13ccba8b971fd5fda9f5605d78f60f53240
  kind: receipt

embedding:
  model: BAAI/bge-base-en-v1.5
  weights_sha256: c7c1988aae201f80cf91a5dbbd5866409503b89dcaba877ca6dba7dd0a5167d7
  library: sentence-transformers
  library_version: 6.0.1
  max_seq_length: 512
  normalize: true
  dtype: float32
  dimension: 768
  batch_size: 128
  # DECLARED, not a receipt, because the builder reads it. Marking it
  # TO_BE_FILLED killed session 20260919-101123 at the embedding step, after
  # the fetch, the duplicate rate and the chunking had all completed: torch
  # was handed the literal string "TO_BE_FILLED" as a device name. It is
  # recorded in build_info.json as well, which is what made it look like a
  # receipt; every other value the builder reads was already declared.
  device: cuda
  vectors_sha256: 0c5a7bac947bc5af26e6b1a53adfe209434706252ed5e1531f836d863fd3e71b
  torch_version: 2.14.0+cu130
  torch_cuda: '13.0'
  cuda_device: NVIDIA RTX PRO 4500 Blackwell
  kind: receipt

ground_truth:
  method: exact k-NN, brute force (faiss IndexFlatIP)
  k: 100
  metric: inner_product
  base_excludes_queries: true
  base_size: 150000
  base_size_note: >
    150,000 chunk vectors, sampled under `sampling.seed` from every chunk the
    baseline chunking produces, so that this fixture is the same size as
    arxiv-150k and stackexchange-150k and the three read line for line. That
    comparability is the design principle of the pair, and it is why the
    corpus is not shipped as every chunk it has.
  ground_truth_sha256: 1376a1f656d34cd8501af7cf5465360f8181fa1558ce315a05d3cd4508796fb2
  kind: receipt

# Tier 2 analogy: how a user's corpus is matched to this fixture.
analogy:
  kind: declared
  corpus_type: filings
  text_length: long
  structure: marked
  time_ordered: true
  topics_trend: false
  languages: [en]
  dimension: 768
  embedding_model: BAAI/bge-base-en-v1.5
  model_family: bge

characterization:
  intrinsic_dimensionality:
    estimator: TwoNN
    value: 33.43
    tolerance: 0.5
  boundary_crispness:
    definition: >
      Fraction of base vectors whose second-nearest centroid distance exceeds
      1.20 x their nearest centroid distance, under k-means with 256 centroids
      (seed 20260919, 20 iterations). Higher is crisper.
    value: 0.107
    tolerance: 0.02
  ambiguous_query_rate:
    definition: fraction of queries with d2 <= 1.10 * d1 against the same centroids
    value: 0.654
    tolerance: 0.02
  skew_top10_share:
    definition: share of base vectors in the 10 largest centroid regions
    value: 0.089
    tolerance: 0.02
  drift:
    definition: >
      Centroids trained on chunks from filings dated before 2024-01-01;
      recall@10 at one-region routing measured separately on queries whose
      source filing is before / after that date. Reported as the pair.
    value_before: 0.632
    value_after: 0.616
    queries_before: 1370
    queries_after: 630
    tolerance: 0.02
  kind: receipt

# The same two configurations the other fixtures publish, at the same
# parameters, so the three are comparable line for line.
reference_results:
  single_node_hnsw:
    params: {M: 32, efConstruction: 200, efSearch: 128}
    recall_at_10: 0.988
    tolerance: 0.01
  semantic_sharded:
    params: {centroids: 256, epsilon: 0.2, probe: 2, M: 32, efSearch: 96}
    recall_at_10: 0.929
    routing_ceiling: 0.930
    storage_amplification: 3.432
    p50_copies: 4
    p95_copies: 4
    p99_copies_per_vector: 4
    tolerance: 0.01
  kind: receipt

# The comparison this fixture is not, named so that its absence is a decision
# rather than an oversight.
contrast:
  fixture: eur-lex
  status: not built
  what_it_is: >
    EU legislation from EUR-Lex: long, public, and far better structured than
    a 10-K — articles, paragraphs and recitals numbered by law rather than by
    convention, with none of the filer-by-filer variance that makes this
    corpus's extraction rate a measurement in its own right.
  what_it_would_settle: >
    Whether the chunking results here are about long documents or about
    BADLY MARKED long documents. On this corpus a section boundary is
    recovered by a rule that 5% of filings defeat; on EUR-Lex the structure is
    given. If a section-aware strategy beats the baseline on both, the finding
    is about length. If it beats it only on EUR-Lex, the finding is that
    structure-aware chunking needs structure it can trust, and the honest
    advice for a corpus of filings is different.
  why_not_this_one: >
    Better structured but a weaker retrieval story: nobody searches EU
    legislation the way an analyst searches filings, so a recall number on it
    is harder to connect to a decision anyone makes. Same pattern as arXiv and
    StackOverflow, where the finding was the two corpora disagreeing.
  kind: declared

projection:
  method: UMAP
  params: {n_neighbors: 30, min_dist: 0.08, metric: cosine, seed: 20260919}
  color_by: the Item the chunk's midpoint falls in
  note: >
    The projection is illustrative. Regions and closure bands drawn on it are
    computed in the full 768-d space, then mapped onto the projection.
  kind: declared

rebuild:
  command: oneground fixture build sec-filings-10k
  substitute_the_user_agent: >
    A rebuilder MUST set their own contact in `source.user_agent` before
    running the build. The address published here is the maintainer's, present
    because EDGAR requires a reachable contact and because a source that
    cannot be re-fetched is not a reproducible fixture. It is not an invitation
    to run this build under someone else's name, and a rebuild that does so
    puts load on a public service under a contact that did not consent to it.
  note: >
    The build is network-bound on EDGAR and honours 8 requests/second. A
    rebuild transfers roughly 3.4 MB per filing examined and stores none of it.

artifacts:
  directory: fixtures/sec-filings-10k/
  # Artifacts this fixture ships that the generic builder does not know about.
  # They join MANIFEST.sha256 beside the standard receipts; a spec that
  # declares none behaves exactly as before.
  extra_receipts:
    - documents.jsonl.zst
    - section_statistics.json
    - near_duplicates.json
  files:
    - documents.jsonl.zst        # 10,000 filings: text, sections with offsets, digest
    - chunks.jsonl.zst           # the sampled 150,000 chunks, with their spans
    - vectors.npy
    - queries.npy
    - query_ids.json
    - ground_truth.npy
    - characterization.json
    - near_duplicates.json
    - section_statistics.json
    - build_info.json
    - projection.npy
    - ground_view_base.parquet
    - ground_view_queries.parquet
    - ground_view_centroids.parquet
    - MANIFEST.sha256

verification:
  command: oneground fixture verify sec-filings-10k
  passes_when: >
    Every artifact digest matches MANIFEST.sha256, and every characterization
    and reference_results value reproduces within its stated tolerance from a
    local rebuild of ground truth and the two reference configurations.
  outcomes: [verified, contradicted, couldnt_check]
  note: >
    couldnt_check is reported when a dependency version differs from the
    pinned one; it is never rounded up to verified. The large artifacts ship
    as a release asset, so a clone without them reports couldnt_check for
    every value that needs them — pass `--asset` to point at an extracted copy.

changelog:
  - build: 1-prep
    date: '2026-09-19'
    note: >
      Specification written. Source resolved live against EDGAR and pinned:
      twelve quarterly indexes, 2022-01-01 to 2024-12-31, 22,036 10-K rows and
      21,287 distinct accessions, streamed and digested without being stored.
      The extraction rule, the baseline chunking and the near-duplicate
      measure are declared here and implemented in
      oneground/sample/sec_filings.py and oneground/measures/duplicates.py,
      with 27 tests. Canonical build pending.

findings:
  # Written from the numbers, after they existed. The spec's header committed
  # in advance to reporting whichever way they fell, and to reporting the two
  # this corpus was expected to show.

  - id: the-ground-is-far-crisper-and-partly-by-construction
    measure: boundary_crispness
    value: 0.107
    caveat: >
      Partly an artefact of chunking, not a property of filings alone. A
      record here is 512 tokens of one document, and the other chunks of that
      document are its nearest neighbours, so regions built from chunks
      inherit a document boundary that abstracts and question titles do not
      have. This number must not be read beside arxiv-150k's and
      stackexchange-150k's as though the three were measured on the same kind
      of record.
    note: >
      Boundary crispness is 0.107 here against arxiv-150k's 0.036 and
      stackexchange-150k's 0.011 -- three times crisper than arXiv, ten times
      crisper than Stack Overflow, on the same model, the same size and the
      same definition. Ambiguity falls with it: 65.4% of queries have a
      second-nearest centroid within 1.10x the nearest, against 89.1% and
      90.8%.

      READ THE `caveat` FIELD ABOVE FIRST. It is not a hedge attached after
      the fact; it is the reason the number is what it is. A fixture whose
      construction flatters a design, and which reports the flattering number
      without saying so, is worse than one that does not flatter it at all --
      because the reader cannot tell which they are holding.

      What survives the caveat is still worth having, and it is this: a
      chunked corpus looks different in the ground from a corpus of short
      whole records. That is precisely the comparison the other two fixtures
      could not offer, and it is the reason this one exists. What does not
      survive it is any claim that SEC filings are intrinsically a crisper
      subject matter than arXiv or Stack Overflow. Nothing here measures
      that.

  - id: semantic-sharding-does-well-here-and-that-is-new
    measure: reference_results
    value:
      single_node_hnsw.recall_at_10: 0.988
      semantic_sharded.recall_at_10: 0.929
      semantic_sharded.routing_ceiling: 0.930
      semantic_sharded.storage_amplification: 3.432
    note: >
      Semantic sharding reaches recall@10 0.929 at 3.432x storage. On
      stackexchange-150k the same configuration managed 0.869 at 3.897x, and
      on arxiv-150k 0.932 at 3.715x. So this corpus is the cheapest of the
      three to shard and among the best served by it -- the first fixture on
      which the architecture is not simply losing.

      The routing ceiling still binds: 0.930 against a measured 0.929, so
      what the routing can reach is what it returns, and no amount of
      efSearch recovers the gap to HNSW's 0.988. That pattern holds on all
      three fixtures. What differs is how high the ceiling sits, and a
      crisper ground puts it six points above Stack Overflow's.

      The single-node HNSW number moves the other way. That is its own
      finding, below.

  - id: the-corpus-easiest-to-shard-is-the-hardest-to-search-exactly
    measure: reference_results
    value:
      single_node_hnsw.recall_at_10: 0.988
      semantic_sharded.recall_at_10: 0.929
      semantic_sharded.storage_amplification: 3.432
    note: >
      The second-order result, and the one a reader is most likely to take
      away, so it is stated as a finding rather than left as a remark
      attached to another.

      Across the three fixtures the two reference configurations move in
      OPPOSITE directions:

        fixture              single-node HNSW    semantic sharded    storage
        arxiv-150k                      0.997               0.932     3.715x
        stackexchange-150k              0.994               0.869     3.897x
        sec-filings-10k                 0.988               0.929     3.432x

      sec-filings-10k has the WORST exact-search result of the three and
      close to the best sharded one, at the lowest storage. The corpus
      easiest to shard is the hardest to search exactly.

      Nothing about that is paradoxical once the two measures are read for
      what they are. HNSW's recall is about how hard the neighbourhood
      structure is to traverse approximately: 512-token chunks of filings sit
      in a denser, more uniform neighbourhood than abstracts, and a graph
      walk finds it harder to reach the true top ten. Semantic sharding's
      recall is about whether the right neighbours fall in the regions the
      routing picks, which a crisper ground makes easier. One measure is
      hurt by what the other is helped by.

      The practical reading, and the reason it matters more than either
      number alone: **a corpus cannot be ranked "easy" or "hard" for
      retrieval in general.** A team that measured only single-node recall
      on a corpus like this one would conclude it was the hardest of the
      three and would be right about that and wrong about the decision in
      front of them. This is the whole argument for measuring the
      architecture question on the user's own vectors rather than inferring
      it from a corpus's reputation, and it is the first time the fixtures
      have shown it rather than asserted it.

      The caveat on `the-ground-is-far-crisper-and-partly-by-construction`
      applies to the sharded half of this comparison too: part of what makes
      the ground crisp here is that records are chunks of shared documents.
      It does not apply to the HNSW half, which is measured on the same
      vectors by a method that knows nothing about regions.

  - id: extraction-quality-varies-and-the-rejections-say-how
    measure: extraction
    value: {examined: 11445, accepted: 10000, rejection_rate: 0.1263}
    note: >
      One of the two things this fixture was built to report. 11,445 filings
      were examined to accept 10,000: 12.63% turned away, with the reasons
      published by category rather than summed.

      sections_empty is 766 of the 1,445 rejections, 53%, and the largest
      single reason. Those are structurally perfect filings -- an
      asset-backed issuer files Items 1 to 15 in order under General
      Instruction J and answers "Omitted." to every one. A rule that counted
      headings would have accepted every one as among the best-structured
      documents in the corpus. The category did not exist until two appeared
      in a 40-filing development sample; without it this corpus would hold
      766 cover pages with Item titles attached.

      too_short is 492: filings that incorporate their substance by
      reference. no_sections is 137 and too_few_sections 43 -- filings whose
      HTML defeats the heading rule, which is the honest count of what this
      parser cannot read, 1.6% of what it examined. not_html 4,
      no_core_section 2, no_10k_document 1.

      fetch_failed is 0 across 11,445 streamed filings.

  - id: boilerplate-is-intrinsic-and-sits-below-any-high-cutoff
    measure: near_duplicates
    value: {'0.50': 0.5628, '0.60': 0.3673, '0.70': 0.1431, '0.80': 0.0431,
            '0.90': 0.0043}
    note: >
      The other thing this fixture was built to report, and the reason the
      threshold range was fixed from a pilot before the build rather than
      chosen after it.

      At the primary 0.80 cutoff the rate is 4.31%, which reported alone
      would say this corpus barely duplicates. At 0.70 it is 14.31%. At 0.60
      it is 36.73%. At 0.50 it is 56.28% -- more than half of all 10,000
      documents have another document in the corpus sharing at least half
      their five-word shingles. The repetition is enormous and it lives in a
      band a single high cutoff cannot see.

      That is what a pre-chunking baseline is for. A chunking strategy
      measured here will show a large duplicate rate at every threshold, and
      most of it belongs to the corpus rather than to the strategy. The three
      filers in the pilot -- Nicholas Financial, Medallion Financial, Henry
      Schein -- scored Jaccard 0.49 to 0.62 between adjacent years, which is
      where the mass turned out to be.

      The 0.50 and 0.60 rows are published as lower bounds, not rates: LSH
      proposes a true pair at those similarities with probability 0.873 and
      0.988, so both figures can only be too small.

  - id: drift-is-the-mildest-of-the-three
    measure: drift
    value: {before: 0.632, after: 0.616}
    note: >
      Centroids trained on chunks from filings dated before 2024-01-01, then
      one-region routing recall@10 measured either side. Before 0.632
      (n=1,370), after 0.616 (n=630): a 2.5% relative fall.

      arxiv-150k improves, 0.522 to 0.549; stackexchange-150k falls 0.485 to
      0.450, a 7.2% relative drop. Filings drift in Stack Overflow's
      direction and by a third as much. That is what a corpus of mandated
      annual disclosures should do -- the vocabulary of risk factors and
      accounting policy changes slowly and the form is fixed by regulation.
      Two years is also a short window to drift across, and the cutoff was
      chosen for a 60/40 split rather than to maximise the effect.

  - id: the-baseline-chunking-cuts-a-boundary-seven-times-in-a-hundred
    measure: chunking.crossing_rate
    value: 0.0703
    note: >
      109,722 of 1,559,834 chunks produced by the declared baseline -- fixed
      512 tokens, 64 overlap, section-blind -- overlap more than one Item.
      Recomputed independently from the shipped 152,000-chunk sample: 10,730
      of 152,000, 0.0706.

      This is the number a section-aware strategy has to beat, published so
      that beating it can be checked rather than claimed. It is lower than it
      first looks because 10-K sections are long: the median recovered
      section is 756 characters but the 95th percentile is 98,503, so most
      512-token windows fall well inside one Item. The fixture ships every
      document's section offsets so a strategy can be scored on the 7% where
      they do not.

  - id: the-structure-is-recovered-almost-always
    measure: section_statistics
    value: {sections_total: 214990, sections_per_document_p50: 22}
    note: >
      214,990 sections across 10,000 accepted documents: a median of 22 of
      the 23 canonical Items per filing, minimum 9. Item 7 is recovered in
      9,942 documents, Item 8 in 9,934, Item 1 in 9,754, Item 1A in 9,676.

      The two low rows are rules of the form, not parser misses. Item 1C is
      recovered in 2,890 because it was assigned to Cybersecurity only for
      fiscal years ending on or after 15 December 2023, and a minority of the
      corpus post-dates that; the earlier filings carrying an Item 1C use the
      number for Executive Officers, which is why section titles are
      published beside the numbers. Item 16 is recovered in 8,104 because
      "Form 10-K Summary" is optional and most filers omit it.

  - id: the-query-skew-is-risk-factors-not-financial-statements
    measure: queries.hot_categories
    value: ['1A']
    note: >
      The spec predicted in advance that applying the other fixtures' "top 5%
      of categories by volume" rule to a corpus of 23 Items would select
      exactly one, and that it would be Item 8, the financial statements. The
      first half is right and the second is wrong: the hot Item is 1A, Risk
      Factors, at 37,977 of 152,000 sampled chunks (25.0%), ahead of Item 8
      at 17.7%, Item 1 at 17.5% and Item 7 at 13.9%.

      Risk factors are the longest narrative section of a modern 10-K, and
      the tables inside Item 8 are dropped by the extraction rule while the
      prose of Item 1A is not. The prediction is recorded here as made and as
      wrong: the rule was applied unchanged and the outcome is a measurement
      of the corpus.

  - id: the-one-line-comparison
    note: >
      Against the other two fixtures: far crisper (0.107 vs 0.036 and 0.011),
      much less ambiguous (0.654 vs 0.891 and 0.908), cheaper to shard
      (3.432x vs 3.715x and 3.897x), better under semantic sharding (0.929 vs
      0.932 and 0.869), harder to search exactly (0.988 vs 0.997 and 0.994),
      and drifting mildly in Stack Overflow's direction (0.632 to 0.616).

      Three corpora now, and the architecture question has three answers
      rather than a trend. What separates this one is not its subject matter
      but that its records are chunks of long documents instead of short
      whole ones -- which is the property the fixture was built to make
      measurable.
