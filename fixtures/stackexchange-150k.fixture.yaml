findings:
  # Written from the numbers, after they existed. The spec's header committed
  # in advance to reporting whichever way they fell; they fell against
  # semantic sharding, harder than they did on arXiv.

  - id: the-ground-is-blurrier-not-crisper
    measure: boundary_crispness
    value: 0.011
    note: >
      The question this fixture was built to answer. A Q&A corpus of short,
      heavily overlapping posts does look different from paper abstracts --
      but in the opposite direction to the one that would have helped.
      Boundary crispness is 0.011 here against arxiv-150k's 0.036: roughly a
      third as crisp, on the same model, the same size and the same
      definition. Whatever separation 256 k-means regions find in Stack
      Overflow questions, almost every vector sits about as close to its
      second region as to its first.

  - id: nearly-every-query-is-ambiguous
    measure: ambiguous_query_rate
    value: 0.908
    note: >
      90.8% of held-out queries have a second-nearest centroid within 1.10x
      the nearest, against 89.1% on arxiv-150k. Both corpora are ambiguous by
      this definition; this one slightly more so. A title like "How do I sort
      a list in Python?" has no single region to belong to, and the
      measurement agrees.

  - id: copies-pile-up-at-the-cap
    measure: semantic_sharded.copies
    value: {p50: 4, p95: 4, p99: 4}
    histogram: {1: 1717, 2: 3019, 3: 4196, 4: 141068}
    note: >
      With epsilon 0.20 and a 4-copy cap, 141,068 of 150,000 base vectors --
      94.0% -- hit the cap, and only 1,717 (1.1%) are stored once. The
      histogram is not a distribution with a tail; it is a wall at the cap.
      That is what a blurry ground does to a closure band: the band admits
      almost everything, so the cap, not the geometry, decides the storage.
      Storage amplification is 3.897x, against 3.715x on arxiv-150k.

  - id: the-two-reference-results
    measure: reference_results
    value:
      single_node_hnsw.recall_at_10: 0.994
      semantic_sharded.recall_at_10: 0.869
      semantic_sharded.routing_ceiling: 0.87
    note: >
      A single HNSW index answers at recall@10 0.994. Semantic sharding at
      256 centroids, epsilon 0.2, probe 2 reaches 0.869 -- and its routing
      ceiling is 0.870, so the loss is not the index, it is the routing: even
      with an exact search inside the regions it probes, the right neighbours
      are not in them. On arxiv-150k the same two configurations gave 0.997
      and 0.932. Semantic sharding loses on both fixtures, and it loses by
      more here (a 0.125 gap against 0.065).

  - id: drift-runs-the-other-way
    measure: drift
    value: {before: 0.485, after: 0.450}
    note: >
      Centroids trained on posts before 2017-01-01, then one-region routing
      recall@10 measured separately on queries either side. Before 0.485
      (n=1063), after 0.450 (n=937): the regions get *worse* for newer
      questions, a 7.2% relative fall. arxiv-150k moves the other way, 0.522
      before to 0.549 after. Stack Overflow's topic mix turns over -- jQuery
      out, React and Kubernetes in -- and 2017 centroids do not describe the
      2020s. This is the one measure where the two corpora disagree in sign,
      and it is the one a reader should take to their own time-ordered corpus.

  - id: the-drift-cutoff-as-realised
    measure: sampling.drift_cutoff
    value: '2017-01-01'
    note: >
      The spec chose 2017-01-01 in advance as the year boundary closest to a
      60/40 split, estimated at 56.6% from the shards' parquet row-group
      statistics. Realised on the built sample -- questions only, after the
      exclusions -- it is 78,969 of 150,000 before the cutoff, 52.6%/47.4%.
      Closer to even than intended, and reported rather than re-tuned: moving
      the cutoff after seeing the split is exactly the fitting this fixture
      exists to avoid.

  - id: the-one-line-comparison
    note: >
      Against arxiv-150k: blurrier (crispness 0.011 vs 0.036), slightly more
      ambiguous (0.908 vs 0.891), more expensive to shard (3.897x vs 3.715x),
      worse under semantic sharding (0.869 vs 0.932 recall@10), and drifting
      the opposite way (0.485->0.450 vs 0.522->0.549). Two corpora that look
      unalike to a reader turn out to agree on the architecture question and
      disagree about time.

  - id: reproduced-off-the-pod
    note: >
      Four published values were recomputed on the developer's Windows laptop
      from the fetched artifacts, against a build produced on Linux/CUDA:
      boundary_crispness 0.0114 (published 0.011), ambiguous_query_rate 0.9085
      (0.908), skew_top10_share 0.0694 (0.069), and one-region recall@10
      0.4619 inside the drift band. All within tolerance. The same export on
      the pod measured one-region recall at 0.4653; the 0.0034 difference is a
      cross-environment k-means difference, which is why the ground-view
      tables and the projection are `declared` rather than receipts.
