      transferring any content.

      No characterization or reference value is recorded from this run. They
      were computed on the pod and are gone; publishing a number read off a
      progress log rather than off the artifact it belongs to is exactly what
      `kind: receipt` exists to prevent. Every value below stays TO_BE_FILLED
      and the status stays `planned`.
  - build: 1
    date: '2026-09-12'
    status: built
    note: >
      Canonical build. Session 20260912-100920, pod no7s6e94fldqmk, RTX PRO
      4500 Blackwell in EU-RO-1 at $0.72/hr, `volume: none`, CUDA 13.0 /
      torch 2.14.0+cu130, Linux 6.8.0, Python 3.12.3. DONE after 1h 07m of a
      2.0 h cap; cost $0.81.

      One streamed pass over all 59 shards took 46m 56s-50m 11s across the two
      attempts and found 20,388,803 eligible questions across 16 years (35.0%
      of 58,329,355 posts). Embedding 152,000 texts took 4m 25s on the
      RTX PRO 4500. The source was verified from the Hub's LFS metadata
      before any content moved, and nothing was written to disk: the 34 GB of
      shards were streamed through the per-year reservoirs.

      Determinism across the two attempts is worth recording. The first
      attempt (A40, CA-MTL-1, killed at its cap) and this one (RTX PRO 4500,
