# Build the pre-baked pod image and lock its digest. Task 017 item 1.
#
# WHY A DIGEST AND NEVER A TAG
# ----------------------------
# A tag is a name that can be moved. Two sessions a week apart naming
# `:latest`, or even `:abc1234`, can run different bytes if anything repushes,
# and nothing in either receipt would say so -- the same failure mode as
# `qdrant:latest`, which the compose files already refuse for the same reason.
# A digest is the bytes. Sessions reference `@sha256:...`, `pod plan` prints
# it, and docker/pod/IMAGE.lock is what says which one.
#
# The lock file is committed by a human, not by this workflow: an automation
# that pushes to the branch it builds from is an automation that can move what
# it is supposed to pin. The job prints the digest and fails if the committed
# lock does not match on a push to main.

name: pod image

on:
  push:
    paths:
      - 'docker/pod/**'
      - 'requirements.txt'
      - '.github/workflows/pod-image.yml'
  pull_request:
    paths:
      - 'docker/pod/**'
      - 'requirements.txt'
      - '.github/workflows/pod-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/oneground-pod

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The base image is CUDA-flavoured and the venv carries torch; the
      # default runner disk does not comfortably hold both plus the layer
      # cache. Reclaim before building rather than discovering it at 80%.
      - name: reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the short SHA and nothing else. No `latest`, no branch
      # name: a floating tag is exactly what this is trying to make impossible,
      # and one sitting in the registry is an invitation to reference it.
      - name: short sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pod/Dockerfile
          # Pushed only from the default branch. A pull request builds the
          # image -- which is the check that matters, since a broken Dockerfile
          # should fail here and not on a billed pod -- without putting
          # anything in the registry for a session to find.
          push: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: the digest, and what to put in IMAGE.lock
        if: steps.build.outputs.digest != ''
        run: |
          DIGEST='${{ steps.build.outputs.digest }}'
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          echo "digest: $DIGEST"
          echo
          echo "docker/pod/IMAGE.lock should read:"
          echo "  image=${IMAGE}"
          echo "  digest=${DIGEST}"
          echo "  tag=${{ steps.sha.outputs.short }}"
          echo "  reference=${IMAGE}@${DIGEST}"
          {
            echo "### pod image built"
            echo
            echo '```'
            echo "image=${IMAGE}"
            echo "digest=${DIGEST}"
            echo "tag=${{ steps.sha.outputs.short }}"
            echo "reference=${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The lock is the contract. If it does not match what was just built on
      # the default branch, sessions are pinned to an image that is no longer
      # what this Dockerfile produces, and that has to be loud.
      #
      # But an EMPTY lock and a WRONG lock are different things, and the first
      # version of this step treated them the same. That made the first build
      # unpassable by construction: the lock cannot name a digest until a build
      # has produced one, and the build failed because the lock did not name
      # it. Run #1 built and pushed the image correctly and then failed here --
      # a red tick against a green artifact, which is the worst combination,
      # because the next reader takes it to mean the image is broken.
      #
      #   empty        the bootstrap case. Warn, say what to commit, succeed.
      #   set + wrong  drift: sessions are pinned to something this Dockerfile
      #                no longer produces. Fail.
      - name: the committed lock must match what was built
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          DIGEST='${{ steps.build.outputs.digest }}'
          LOCK=docker/pod/IMAGE.lock
          test -f "$LOCK" || { echo "::error::$LOCK is missing"; exit 1; }
          LOCKED=$(grep '^digest=' "$LOCK" | cut -d= -f2- || true)
          if [ -z "$LOCKED" ]; then
            echo "::warning::$LOCK has no digest yet; this build produced $DIGEST"
            echo "Bootstrap: commit that digest to $LOCK."
            echo "Until you do, no session can reference this image --"
            echo "oneground/pod/image.py raises rather than falling back to the tag,"
            echo "so an unfilled lock cannot silently become a floating-tag run."
            exit 0
          fi
          if [ "$LOCKED" != "$DIGEST" ]; then
            echo "::error::$LOCK pins $LOCKED but this build produced $DIGEST."
            echo "Update $LOCK and commit it; sessions reference the locked digest."
            exit 1
          fi
          echo "lock matches: $DIGEST"
