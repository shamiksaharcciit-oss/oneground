# Check the pod image pin. Task 017d.
#
# THIS WORKFLOW DOES NOT BUILD THE IMAGE.
#
# It used to. Run #4 built the same Dockerfile from the same requirements.txt
# as run #1 and produced a different digest -- the base resolved identically
# (sha256:c7ff5829...), but apt and pip fetch from services that do not promise
# byte-identical responses over time, and layer metadata carries build
# timestamps regardless. So "rebuild and compare against the lock" cannot pass
# in a steady state, and a red run sat next to a perfectly good image on every
# push: the locked digest names an image that exists, was pushed, and has been
# pulled and run by two pod sessions, most recently by 017c, which proved
# Postgres starts on it.
#
# Rebuild-to-compare was answering "are these bytes reproducible". They are
# not, and never were going to be. The two questions worth asking are:
#
#   1. pullable   does the registry still serve the digest the lock names?
#                 This is the only question whose answer changes what a
#                 session does -- a session pins that digest.
#
#   2. co-change  if a commit touched the image's build inputs, did the lock
#                 move in the same range? Not "does a rebuild reproduce it"
#                 but "did whoever changed the recipe re-lock what it makes".
#
# A digest and never a tag, for the original reason: a tag is a name that can
# be moved, and two sessions a week apart naming the same tag can run different
# bytes with nothing in either receipt saying so.
#
# Building is a local, deliberate act: docker/pod/rebuild.sh builds, pushes,
# writes the pushed digest into the lock, and tells you to commit the two
# together. The logic for both checks lives in oneground/pod/imagecheck.py, so
# it is unit-tested rather than only exercised by being run.
#
# THE TRIGGER SET
# ---------------
# The image's actual build inputs -- the Dockerfile and every path it COPYs --
# and this workflow file. NOT everything under docker/pod/**: the session
# scripts that sync at run time are not in the image and cannot change its
# bytes. Commit 696dd03 touched only those and fired an 18-minute build for
# nothing.
#
# `oneground/pod/test_imagecheck.py` asserts these paths match the set derived
# from the Dockerfile, so a new COPY source that is not listed here fails the
# suite rather than silently escaping the check.

name: pod image

on:
  push:
    paths:
      - 'docker/pod/Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/pod-image.yml'
  pull_request:
    paths:
      - 'docker/pod/Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/pod-image.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # The co-change check diffs a commit range, so the range has to be in
      # the clone. fetch-depth: 0 rather than a guess at how deep: a force
      # push or a long PR can put the base further back than any fixed number,
      # and a missing base makes `changed_files` raise rather than quietly
      # report that nothing changed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: docker/setup-buildx-action@v3

      - name: the derived build-input set
        run: |
          echo "The image re-locks only when one of these changes:"
          python -m oneground.pod.imagecheck inputs | sed 's/^/  /'

      # Read-only: the check reads a manifest and pulls no layers, so the
      # token needs packages:read and nothing more.
      #
      # buildx is set up because the check prefers
      # `docker buildx imagetools inspect`: `docker manifest inspect` cannot
      # read an OCI manifest on an older client, and this image is OCI.
      # Measured on Docker 20.10.17 against a public image that exists:
      #   unsupported manifest media type and no default available:
      #   application/vnd.oci.image.manifest.v1+json
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. The locked digest must still be servable. An empty lock is the
      #    bootstrap case, kept from task 017 and reached by run #4: it warns
      #    and passes, because a fixture that has not been built yet is not
      #    drift. With a digest present that branch is unreachable.
      - name: the locked digest must be pullable
        run: python -m oneground.pod.imagecheck pullable

      # 2. A change to the recipe must come with a change to the pin.
      #    push:  before..after, with before zeroed on a branch's first push.
      #    PR:    base..head.
      - name: a build-input change must re-lock
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
              BASE="$PR_BASE"; HEAD="$PR_HEAD"
          elif [ "$EVENT" = "push" ]; then
              BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
              if [ "$BASE" = "$ZERO" ] || [ -z "$BASE" ]; then
                  # A branch's first push has no before. There is no range to
                  # judge, and inventing one (HEAD~1, say) would judge a commit
                  # this push did not contain.
                  echo "::notice::first push on this ref; no range to check"
                  exit 0
              fi
          else
              echo "::notice::$EVENT has no commit range; co-change not checked"
              exit 0
          fi
          echo "range: $BASE..$HEAD"
          python -m oneground.pod.imagecheck co-change --base "$BASE" --head "$HEAD"

      - name: what this run checked
        if: always()
        run: |
          {
            echo "### pod image pin"
            echo
            echo "This workflow does **not** build the image. It checks that"
            echo "the digest in \`docker/pod/IMAGE.lock\` is still pullable,"
            echo "and that a change to the image's build inputs came with a"
            echo "change to the lock."
            echo
            echo "Rebuilding is local and deliberate:"
            echo '```'
            echo "bash docker/pod/rebuild.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
