# Record what a calibration job appended, without ever writing to master.
#
# Two jobs, one action:
#
#   1. Push the appended history lines to the `calibration` branch. master
#      merges from it. The harness never commits to master directly, so a
#      scheduled bot cannot move the branch a release is cut from.
#   2. If any BLOCKING line came out `contradicted`, open an issue whose body
#      carries the offending line verbatim, and fail.
#
# `couldnt_check` does not open an issue and does not fail. It is a gap in the
# reference, not a defect in this installation, and it is already visible in
# the history and in `oneground calibrate show`.

name: record calibration
description: >
  Commit appended calibration lines to the calibration branch and open an
  issue on a contradiction.

inputs:
  scope:
    description: blocking | advisory
    required: true
    default: blocking
  label:
    description: short name of the job, used in the commit message
    required: true
  history:
    description: path to the history file
    required: false
    default: calibration/history.jsonl
  branch:
    description: branch the harness is allowed to write to
    required: false
    default: calibration
  new_lines:
    description: >
      where to write the lines this run appended. Every step after `what
      changed` reads this rather than re-deriving them from the history.
    required: false
    default: /tmp/oneground-new-calibration-lines.jsonl

runs:
  using: composite
  steps:
    - name: what changed
      id: diff
      shell: bash
      env:
        NEW_LINES: ${{ inputs.new_lines }}
      run: |
        set -euo pipefail
        # Capture the lines themselves, not just the count. Every later step
        # works from this file: the push merges exactly these onto the branch,
        # and the contradiction check judges exactly these. A count alone only
        # locates lines by position, which stops being true the moment a
        # concurrent run appends to the same branch.
        : > "$NEW_LINES"
        added=0
        if git diff --quiet -- "${{ inputs.history }}"; then
          echo "no new calibration lines"
        else
          read -r added removed _ < <(git diff --numstat -- "${{ inputs.history }}")
          # Append-only. A removed line is somebody else's measurement being
          # rewritten, and no amount of retrying makes that the right push.
          if [ "${removed:-0}" != "0" ]; then
            echo "::error::${removed} line(s) removed from ${{ inputs.history }} -- the calibration history is append-only"
            exit 1
          fi
          git diff -U0 -- "${{ inputs.history }}" \
            | grep '^+' | grep -v '^+++' | cut -c2- > "$NEW_LINES"
          echo "$added new line(s)"
        fi
        echo "appended=${added:-0}" >> "$GITHUB_OUTPUT"

    - name: push to the calibration branch
      if: steps.diff.outputs.appended != '0'
      shell: bash
      env:
        REMOTE: origin
        BASE_BRANCH: main
        PUSH_ATTEMPTS: "3"
        NEW_LINES: ${{ inputs.new_lines }}
      run: |
        set -euo pipefail
        # The git plumbing lives in a script so it can be tested against a
        # stubbed remote. Inline, it failed run #3:
        #
        #     ! [rejected]  calibration -> calibration (non-fast-forward)
        #
        # It fetched with `|| true` and then checked out `origin/$BRANCH`,
        # falling back to a bare `checkout -B` -- which on a tag push, where
        # no refs/remotes/origin/* refspec is configured, started the branch
        # from the tag commit. See .github/scripts/test_push_calibration.py.
        "${{ github.action_path }}/../../scripts/push-calibration.sh" \
          "${{ inputs.branch }}" \
          "${{ inputs.history }}" \
          "$NEW_LINES" \
          "calibration(${{ inputs.label }}): ${{ steps.diff.outputs.appended }} line(s) from run ${{ github.run_id }}"

    - name: find contradictions
      id: bad
      shell: bash
      env:
        NEW_LINES: ${{ inputs.new_lines }}
      run: |
        set -euo pipefail
        # The rule lives in a script so it can be tested. It used to be a
        # heredoc here, and its bug -- filtering the whole history for
        # blocking contradictions and then slicing the last N of *those*,
        # where N counted appended lines -- failed run #1 on seven
        # contradictions the run had not produced. See
        # .github/scripts/test_count_contradictions.py.
        # --lines, not --appended: by now the push step has merged this run's
        # lines onto the calibration branch, so the tail of the history is not
        # reliably ours. These are.
        python "${{ github.action_path }}/../../scripts/count_contradictions.py" \
          --lines "$NEW_LINES" \
          --github-output "$GITHUB_OUTPUT"

    - name: open an issue carrying the line
      if: inputs.scope == 'blocking' && steps.bad.outputs.count != '0'
      uses: actions/github-script@v7
      with:
        script: |
          const body = `${{ steps.bad.outputs.body }}`;
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `calibration contradicted (${{ inputs.label }}, run ${context.runId})`,
            body: [
              'A blocking calibration check came out `contradicted`.',
              '',
              'The tolerance is not to be widened to clear this. Diagnose which',
              'layer moved -- the pinned dependencies, the engine, the corpus',
              'digest, or the simulator -- and record the decomposition.',
              '',
              'The offending history line(s):',
              '',
              '```json',
              body,
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n'),
            labels: ['calibration'],
          });

    - name: fail on a blocking contradiction
      if: inputs.scope == 'blocking' && steps.bad.outputs.count != '0'
      shell: bash
      run: |
        echo "::error::${{ steps.bad.outputs.count }} blocking calibration check(s) contradicted"
        exit 1
