<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="oneground-lab-token" content="__ONEGROUND_LAB_TOKEN__">
<title>oneground lab</title>
<!-- Served by `oneground lab` from this machine, read-only. No CDN, no
     webfont, no analytics, no inline script or style: the server's
     Content-Security-Policy refuses any other origin, and this page asks for
     nothing the server did not send. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/lab.css?token=__ONEGROUND_LAB_TOKEN__">
</head>
<body>

<header class="top">
  <p class="eyebrow">oneground lab · served from this machine · read-only</p>
  <h1 id="config">loading the run…</h1>
  <p class="source mono" id="run-line">—</p>
  <p class="mode" id="mode" role="status">measuring…</p>
</header>

<main>

<section id="ground" aria-labelledby="ground-h">
  <h2 id="ground-h">The ground</h2>
  <div class="ground-grid">
    <figure class="stage">
      <canvas id="ground-canvas" width="640" height="640"
              aria-label="every base vector, coloured by how many regions it is copied into, laid out by home region"></canvas>
      <figcaption class="source">
        Laid out by home region: one cell per region, its vectors in id order.
        This is not a projection — the state holds no positions. Outlines mark
        the query trace below.
      </figcaption>
      <ul class="outline-key source" aria-label="what the outlines mark">
        <li><span class="key routed"></span>the region the query was routed to</li>
        <li><span class="key probed"></span>the other regions it probed</li>
        <li><span class="key neighbours"></span>the home regions of its true neighbours</li>
      </ul>
    </figure>

    <div class="panel readout">
      <div class="slider-row">
        <label for="eps">
          <span>closure band ε</span>
          <output id="eps-out" for="eps">—</output>
        </label>
        <input type="range" id="eps" min="0" max="0.5" step="0.005" value="0.2">
        <p class="source" id="eps-simulated">—</p>
        <p class="stale" id="eps-stale" hidden></p>
      </div>

      <div class="counters">
        <div class="counter"><span class="value" id="c-copied">—</span><span class="label">vectors copied</span></div>
        <div class="counter"><span class="value" id="c-amp">—</span><span class="label">storage</span></div>
        <div class="counter"><span class="value" id="c-p99">—</span><span class="label">p99 copies</span></div>
        <div class="counter"><span class="value" id="c-ceiling">—</span><span class="label">routing ceiling@10</span></div>
      </div>

      <div>
        <h3>copies per vector</h3>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </div>

  <p class="caption" id="ground-caption">—</p>
  <ul class="gaps" id="ground-gaps"></ul>
</section>

<section id="trace" aria-labelledby="trace-h">
  <h2 id="trace-h">One query's trace</h2>
  <div class="trace-grid">
    <div class="panel">
      <div class="query-row">
        <label for="query">query</label>
        <input type="number" id="query" min="0" value="0">
        <button type="button" id="prev" aria-label="previous query">←</button>
        <button type="button" id="next" aria-label="next query">→</button>
      </div>
      <ol class="trace" id="trace-steps"></ol>
    </div>
    <div class="panel recall" id="recall" aria-live="polite"></div>
  </div>
  <ul class="gaps" id="trace-gaps"></ul>
</section>

</main>

<footer>
  <h3>check</h3>
  <dl class="check" id="check"></dl>
</footer>

<script src="/static/lab.js?token=__ONEGROUND_LAB_TOKEN__"></script>
</body>
</html>
