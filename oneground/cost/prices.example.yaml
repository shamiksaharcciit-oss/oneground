# oneground node price table -- PROVIDED, DECLARED, NOT FETCHED.
#
# kind: declared. Every number here was typed in by a human from a vendor's
# public page on the date in `as_of`. oneground does not call a pricing API,
# has no vendor relationship, and will not acquire one: a cost model that
# phones a vendor is a cost model whose answer you cannot re-derive next year.
#
# Prices move. A cost computed from this table is only as current as `as_of`,
# and every cost oneground reports carries an error band that says so.
#
# To use your own numbers, copy this file, edit it, and point
# `verify.cost.prices` at it. That is the intended path: your negotiated rates
# are not on any public page.

as_of: 2026-09-11
kind: declared
currency: EUR
source: >-
  Public list prices, EU regions, typed from vendor pages on the as_of date.
  On-demand, no committed-use discount, no support plan, no egress.
note: >-
  Compute only. Storage, network egress, load balancers, backups and the
  people who run it are not in these numbers, and a real bill is larger.
  Nothing here is a quote.

nodes:
