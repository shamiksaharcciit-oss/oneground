# Task 032b: the laptop half of the state proof.
#
# The twin of `requirements.arxiv-150k.determinism.pod.yaml`, differing in
# exactly two things -- where the corpus is, and where the run writes -- so
# that the two halves of the comparison measure the same configurations of the
# same sample under the same seed, and any difference between their emitted
# state is a difference between the environments rather than between two
# requirements files.
#
# Not a replacement for requirements.arxiv-150k.yaml, which is frozen.

oneground: 1

run:
  name: 032b-state-local
  mode: measure
  seed: 20260908
  workdir: ./runs/032b-state-local

corpus:
  sample:
    kind: receipt

    vectors:
      path: ~/oneground-assets/arxiv-150k/vectors.npy
      normalized: true             # the builder normalized at embed time

    queries:
      path: ~/oneground-assets/arxiv-150k/queries.npy
      count_min: 50
      source: written

    target_sample_size: 150000

# ------------------------------------------------------------------
# simulate -- the reference configuration only, deterministic
# ------------------------------------------------------------------
# Byte-for-byte the pod file's block. Two rows come out of it: the `include`
# entry names `deterministic: true` explicitly and the grid does not, and a
# build setting is deliberately not canonicalised into one label (task 032) --
# `deterministic=False` has to stay a different label from `deterministic=True`
# for task 029's comparison to be expressible at all. Both rows are the same
# build, so their state should be identical to each other as well as across
# the two machines, which is a free extra check this run gets to make.
simulate:
  kind: declared
  families: [semantic_sharded]
  node_counts: [3]
  ground_truth_k: 100

  include:
    - {family: semantic_sharded, centroids: 256, epsilon: 0.2, probe: 2,
       M: 32, efSearch: 96, deterministic: true}

  grid:
    semantic_sharded:
      centroids: [256]
      epsilon: [0.2]
      probe: [2]
      M: [32]
      efSearch: [96]

  budget:
    max_minutes: 45
