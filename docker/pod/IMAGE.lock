# The pod image, pinned by digest. Task 017 item 1.
#
# A digest and not a tag, for the reason the compose files refuse
# `qdrant:latest`: a tag is a name that can be moved, and two sessions naming
# the same tag can run different bytes with nothing in either receipt saying
# so. `reference` is what a session spec uses and what `pod plan` prints.
#
# HOW THIS GETS FILLED
# --------------------
# By `docker/pod/rebuild.sh`, run locally, and committed by a human in the same
# commit as the change that caused the rebuild. CI does not write this file and
# does not build the image -- an automation that pushed to the branch it builds
# from could move the pin it exists to hold still.
#
#     bash docker/pod/rebuild.sh
#     git add docker/pod/Dockerfile requirements.txt docker/pod/IMAGE.lock
#     git commit
#
# See docs/POD_IMAGE.md.
#
# STATE: BUILT AND LOCKED
# -----------------------
# `pod image` run #1, on main at 6641737, built and pushed the image in
# 18m18s. The digest below is what it produced. Two pod sessions have since
# pulled and run it; 017c proved Postgres starts on it.
#
# The tag is recorded for tracing a digest back to the commit that built it.
# Nothing references the tag, and nothing should: `reference` is the digest.
#
# THE BUILD IS NOT REPRODUCIBLE, AND THIS DIGEST IS NOT UPDATED
# ------------------------------------------------------------
# Run #4 (34709757290) rebuilt the same Dockerfile from the same
# requirements.txt, uncached, and produced a DIFFERENT digest:
#
#     locked (run #1)   sha256:81567d58615f41e708c5aff8eb3e32af1cd4121daac4a9dddd3dbbadf9d388ce
#     run #4            sha256:12bd6a3ecc2e0ba490bb3946da205fa3506d1cfee6991a4f050458ca47f123cf
#
# Not the base image moving: both runs resolved
# runpod/pytorch:1.1.0-cu1300-torch291-ubuntu2404 to the same
# sha256:c7ff5829fb34e42557edf949396d3875a74b3a896f7835268670cc62fdd3e60a.
# The difference is in our own layers -- apt and pip fetch from services that
# do not promise byte-identical responses over time, and layer metadata
# carries build timestamps regardless.
#
# The digest below is LEFT ALONE on purpose. It names an image that exists,
# that was pushed, and that two pod sessions have pulled and run. Nothing about
# it is stale; the rebuild simply produced a second, equally valid image.
# Overwriting the pin every time CI ran would defeat the pin.
#
# WHAT CI CHECKS NOW (task 017d)
# ------------------------------
# The old check rebuilt and compared, which could not pass in a steady state
# and left a red run beside a good image on every push. It is gone. CI never
# builds. It checks two things instead:
#
#   pullable    `docker manifest inspect` on the digest below must succeed.
#               This is the only question whose answer changes what a session
#               does -- a session pins this digest.
#   co-change   if a commit touched the image's build inputs (the Dockerfile
#               and what it COPYs -- today just requirements.txt), this file
#               must have changed in the same range.
#
# The rule is one-directional: re-locking without touching the recipe is fine,
# because a rebuild against an unchanged recipe produces a new, equally valid
# digest. That is what run #4 demonstrated.

image=ghcr.io/shamiksaharcciit-oss/oneground-pod
digest=sha256:81567d58615f41e708c5aff8eb3e32af1cd4121daac4a9dddd3dbbadf9d388ce
tag=6641737
reference=ghcr.io/shamiksaharcciit-oss/oneground-pod@sha256:81567d58615f41e708c5aff8eb3e32af1cd4121daac4a9dddd3dbbadf9d388ce

# The fallback until the digest exists. This is the image every session
# through task 016 actually ran, resolved live from Docker Hub and pinned in
# oneground/verify/__init__.py as POD_IMAGE.
fallback_image=runpod/pytorch:1.1.0-cu1300-torch291-ubuntu2404
