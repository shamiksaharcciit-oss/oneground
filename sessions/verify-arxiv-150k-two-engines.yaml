# Generated by `oneground verify --target runpod`.
#
# This file describes a session; it creates nothing. `oneground pod
# up` is the only thing that can create a billable resource, and it
# still requires a typed 'y' at a terminal.
# Generated 2026-09-10T23:03:51Z
#
# The pod runs the engine's compose file and the load generator on
# the same host, so latency is attributable and throughput can be
# measured at the requested concurrency. Every row it produces
# carries environment_id = the pod id.
gpu:
- RTX PRO 4000
- RTX PRO 4500
- RTX A4000
- L4
- RTX PRO 6000
- RTX PRO 6000 WK
volume: vecbench
volume_mount_path: /workspace
image: ghcr.io/shamiksaharcciit-oss/oneground-pod@sha256:81567d58615f41e708c5aff8eb3e32af1cd4121daac4a9dddd3dbbadf9d388ce
disk_gb: 40
env:
  ONEGROUND_VERIFY: '1'
  ONEGROUND_CONCURRENCY: '32'
  ONEGROUND_TARGET_QPS: '200'
  ONEGROUND_DURATION_MIN: '5'
  ONEGROUND_ENGINES: qdrant,pgvector
  ONEGROUND_REQUIREMENTS: requirements.arxiv-150k.pod.yaml
  ONEGROUND_RUNS: '3'
  ONEGROUND_MEASURE_CEILING: '1'
  ONEGROUND_CORPUS_TARBALL: /workspace/arxiv-150k-large.tgz
  ONEGROUND_CORPUS_MANIFEST: fixtures/arxiv-150k/MANIFEST.sha256
  # Task 017b. `verify.runs: N` restarts the engine between load runs so each
  # run is a second sample rather than a continuation of the first. On a pod
  # the engines are native processes, not containers, so there is nothing for
  # `docker restart` to act on -- without this, verify records
  # "not restarted: no engine_restart_command and no known container" and the
  # spread is measured across runs that shared a warm process.
  #
  # This session measures BOTH engines in turn, which is why `{engine}` is
  # substituted rather than the command naming one: qdrant is pkill plus
  # setsid, postgres is pg_ctl, and a command that ignored which engine it was
  # restarting would restart the wrong one and report success anyway.
  ONEGROUND_ENGINE_RESTART_COMMAND: bash corpora/restart_engine.sh {engine}
setup: corpora/POD_SETUP.md
run: bash corpora/run_verify_pod.sh
remote_repo: /workspace/oneground
remote_log: /workspace/oneground-verify.log
done_marker: DONE
