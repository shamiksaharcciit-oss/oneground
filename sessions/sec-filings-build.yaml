# sec-filings-10k canonical build (task 030), as a pod session.
#
# `oneground pod plan sessions/sec-filings-build.yaml` resolves this live and
# prices it; `up` is the only subcommand that creates anything, and it still
# needs a typed 'y' at a TTY.
#
# WHAT THIS BUILD DOES, and what is unusual about it.
#
# The source is not a dataset: it is up to 21,287 separately-filed HTML
# documents fetched one at a time from a public government service that
# publishes a rate limit and requires a declared contact. So this is the first
# fixture build whose slow phase is the network rather than the card:
#
#   fetch + extract   ~12,000 filings at 8 requests/second, ~3.4 MB read each
#                     and abandoned after the 10-K part. Network-bound. The
#                     GPU idles through it, which is the price of doing this
#                     in one session as the brief requires.
#   duplicates        the pre-chunking near-duplicate rate over 10,000
#                     documents. CPU, ~14 minutes projected from a 38-document
#                     measurement.
#   chunking          the tokenizer over ~3.5 GB of text. CPU.
#   embed             ~152,000 chunks of 512 tokens. This is what the card is
#                     for, and 512-token chunks are several times heavier per
#                     record than stackexchange-150k's short posts.
#   ground truth      exact k-NN, 150,000 x 768, as the other two fixtures.
#
# Nothing streamed is stored: the twelve quarterly indexes are pulled through
# a hash and a line filter, and each submission's response is abandoned once
# its 10-K part has been read. What lands on disk is the corpus, not the
# source.
#
# ONE WATCHER PER SESSION. `oneground pod watch` is not read-only at its
# edges: every exit path terminates the pod. Two watchers on one session means
# two independent cap clocks and two things that will fetch and terminate, and
# whichever fires first decides the session while the other is still polling a
# pod that no longer exists. Session 20260918-233949 was watched twice, by
# accident, and came to no harm only because the one that reached the cap did
# the right thing. Stop a watcher before starting another.

# The embedding phase wants a card; everything before it does not. The list is
# the same as the arXiv and StackExchange builds so the three are comparable,
# and the first one actually offered in the volume's datacenter wins.
gpu:
  - RTX PRO 4500
  - RTX PRO 6000
  - RTX 6000 Ada
  - RTX 4090

volume: vecbench                 # datacenter derived from the name
volume_mount_path: /workspace

# The image the other two canonical builds used, so the interpreter and the
# pins resolve the same way. Setup builds a fresh venv from requirements.txt.
image: runpod/pytorch:1.1.0-cu1300-torch291-ubuntu2404

# Larger than the other builds' 20. This fixture ships a corpus, not a sample:
# documents.jsonl.zst is ~0.7 GB compressed (measured at 69 kB per document on
# 30 documents), vectors.npy is 460 MB, and both tarballs hold copies. 40 GB
# leaves room without being a cost in itself.
disk_gb: 40

env:
  HF_HOME: /workspace/hf

setup: corpora/POD_SETUP.md      # executed as the venv-on-local-disk script
run: FIXTURE=sec-filings-10k bash corpora/run_fixture_build.sh

remote_repo: /workspace/oneground
remote_log: /workspace/oneground-session.log
done_marker: DONE                # run_fixture_build.sh prints it near the end

outputs:
  # The run log, FIRST, so that a run terminated before it produces any
  # artifact still comes home with its evidence. An output that does not
  # exist is already reported as couldnt-check rather than failing the fetch,
  # so this needs no `optional` flag -- and `Output` has none.
  #
  # Session 20260918-233949 hit its cap mid-build. `watch` correctly fetched
  # what existed, which was neither tarball, and terminated -- and the log
  # went with the pod, so which phase the run had reached is unknowable. The
  # phase timings and the rejection tally are the deliverable when the corpus
  # is not, and they were sitting in a file nobody had declared.
  - {remote: /workspace/oneground-session.log,
     local: tasks/scratch/030-session-log/}
  # The review bundle: receipts, the section statistics and the duplicate
  # rate. Small enough for the repo.
  - {remote: /workspace/sec-filings-10k-small.tgz, local: ./, extract: true}
  # The release asset: vectors, queries and the documents with their section
  # offsets. Deliberately outside the repo.
  - {remote: /workspace/sec-filings-10k-large.tgz, local: ../oneground-assets/}

# The watchdog terminates the run if the log stops growing for this long. Every
# phase reports progress: the fetch every 500 accepted documents, shingling
# every 1,000, the LSH banding every 8 bands, exact scoring every 50,000 pairs,
# chunking every 1,000 documents, and embedding per batch. That logging was
# added for this session -- the duplicate measure previously ran ~14 minutes in
# silence, which is a blind spot a 20-minute watchdog would not have caught
# until it was nearly too late.
stall_minutes: 20

caps:
  # The brief set max_hours 2.0 and max_usd 2.50. The hours were raised to 3.0
  # on the developer's explicit decision after session 20260918-233949 hit the
  # two-hour cap mid-build and produced nothing; the dollar cap is unchanged
  # and is still the real ceiling.
  #
  # The money was never the binding constraint. At $0.72/hr -- the top of the
  # live range, which is what the other builds were billed and what this cap
  # is confirmed against, rather than the $0.34 floor -- three hours is $2.16,
  # inside max_usd. max_usd alone would allow 3.47 h.
  #
  # Measured from the terminated session rather than estimated: fetch to
  # 10,000 documents is ~29 min at 6.5 filings/s, and the phases after it
  # total ~78 min, so a cold start needs about 1h55m. Three hours leaves an
  # hour of margin on the phase whose duration depends on a third party.
  #
  # If the cap binds, what survives is whatever the run had finished: the
  # runner packages the receipts the moment the MANIFEST is written and
  # re-packages after every later stage, and the run log is now a declared
  # output so a run that never reaches its MANIFEST still comes home with its
  # phase timings and its rejection tally.
  max_hours: 3.0
  max_concurrent: 1
  max_usd: 2.50
