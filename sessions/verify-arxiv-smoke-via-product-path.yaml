# Generated 2026-09-09T22:34:23Z
#
# The pod runs the engine's compose file and the load generator on
# the same host, so latency is attributable and throughput can be
# measured at the requested concurrency. Every row it produces
# carries environment_id = the pod id.
gpu:
- RTX PRO 4000
- RTX PRO 4500
- RTX A4000
- L4
- RTX PRO 6000
- RTX PRO 6000 WK
volume: vecbench
volume_mount_path: /workspace
image: ghcr.io/shamiksaharcciit-oss/oneground-pod@sha256:81567d58615f41e708c5aff8eb3e32af1cd4121daac4a9dddd3dbbadf9d388ce
disk_gb: 40
env:
  ONEGROUND_VERIFY: '1'
  ONEGROUND_CONCURRENCY: '8'
  ONEGROUND_TARGET_QPS: '50'
  ONEGROUND_DURATION_MIN: '1'
  # Task 017b: was `qdrant`, and requirements.smoke.yaml has said
  # `engines: [qdrant, pgvector]` since task 015. This file is GENERATED from
  # that one and was last generated 2026-09-09, before pgvector existed here,
  # so the two drifted apart with nothing checking. Session 20260912-171431
  # paid for the difference: run_verify_pod.sh started only qdrant, `verify`
  # read both engines from the requirements, and the run died on
  # "pgvector: connection refused" after the setup had gone perfectly.
  ONEGROUND_ENGINES: qdrant,pgvector
  ONEGROUND_REQUIREMENTS: requirements.smoke.yaml
  ONEGROUND_RUNS: '3'
  ONEGROUND_MEASURE_CEILING: '1'
  # Task 017b. `verify.runs: N` restarts the engine between load runs so each
  # run is a second sample rather than a continuation of the first. On a pod
  # the engines are native processes, not containers, so there is nothing for
  # `docker restart` to act on -- without this, verify records
  # "not restarted: no engine_restart_command and no known container" and the
  # spread is measured across runs that shared a warm process.
  # `{engine}` is substituted per engine: qdrant and postgres are not
  # restarted the same way.
  ONEGROUND_ENGINE_RESTART_COMMAND: bash corpora/restart_engine.sh {engine}
setup: corpora/POD_SETUP.md
run: bash corpora/run_verify_pod.sh
