# stackexchange-150k canonical build, as a pod session (task 016).
#
# Same shape as sessions/arxiv-build.yaml. Three things differ, all because the
# corpus does:
#
#   * it uses no network volume at all (`volume: none`), so the datacenter is
#     chosen by GPU availability rather than derived from a volume's region.
#     Nothing it produces needs to outlive the pod.
#   * the source is not on a volume, and is never put anywhere. It is 59 parquet
#     shards, ~34 GB, at a pinned revision of `mikex86/stackoverflow-posts`,
#     and the sampler reads their row groups over the network straight into the
#     per-year reservoirs. Nothing is downloaded and nothing is stored; the run
#     writes only the sample. arxiv-150k's 4 GB snapshot, by contrast, was
#     uploaded by hand once and has lived on the vecbench volume since, which
#     is why that session still names a volume and this one does not.
#   * that read is still ~32 GB of column chunks over the wire, so the run is
#     longer than arxiv-150k's 19 minutes and the caps are larger. They are
#     still caps, not estimates: `watch` terminates at them.
#
#     python -m oneground.pod plan sessions/stackexchange-build.yaml
#     python -m oneground.pod up   sessions/stackexchange-build.yaml   # asks first
#     python -m oneground.pod watch <id>

gpu:
  # Display names, in preference order. With `volume: none` below, the first
  # one available *anywhere* wins, and the cheapest listed datacenter offering
  # it is chosen -- preference order first, price only between the regions
  # offering that card. arxiv-150k build 3 ran on an RTX PRO 4500 Blackwell,
  # and the same list is used here so the two fixtures' embeddings come off
  # comparable hardware where possible. `plan` resolves this live, and stock
  # moves between runs: re-run `plan` before `up`.
  - RTX PRO 4500
  - RTX PRO 6000
  - RTX 6000 Ada
  - RTX 4090

# No network volume. Task 016's build needs nothing that outlives the pod: the
# source is streamed and never stored, and both outputs come back as tarballs.
# Pinning a region to a volume also pins it to that region's stock, and EU-RO-1
# -- where vecbench lives -- was offering only a $5.98/hr B200 (over cap) and an
# AMD MI300X our cu130 torch cannot run on. With `none` the datacenter is chosen
# by GPU availability instead: the cheapest listed datacenter offering the first
# available GPU in the list above. `plan` prints which, and at what price.
volume: none
volume_mount_path: /workspace   # an ordinary directory on the container disk

# The same pinned tag as arxiv-build.yaml: CUDA 13.0 for torch 2.14.0+cu130,
# ubuntu2404 for python 3.12.3. The image's own torch is irrelevant -- setup
# builds a fresh venv without --system-site-packages and installs
# requirements.txt exactly.
image: runpod/pytorch:1.1.0-cu1300-torch291-ubuntu2404

# Container disk. With no volume this holds everything the run writes, so it is
# sized for the whole build rather than just the venv: the venv at /root/.venv,
# the bge-base weights under HF_HOME, the fixture artifacts (vectors.npy is
# ~460 MB) and both output tarballs. The 34 GB of shards are NOT here -- they
# are streamed and never written. 60 GB is comfortable for that, and the disk
# dies with the pod, so nothing is left behind to pay for.
disk_gb: 60

env:
  HF_HOME: /workspace/hf          # container disk now, not the volume
  FIXTURE: stackexchange-150k
  # No SOURCE. The spec names its own source -- repo, revision and per-shard
  # digests -- and the sampler streams it. A SOURCE here would mean "read these
  # local shards instead", which is the offline path, not this one.

setup: corpora/POD_SETUP.md      # executed as the venv-on-local-disk script
run: bash corpora/run_fixture_build.sh

remote_repo: /workspace/oneground
remote_log: /workspace/oneground-session.log
done_marker: DONE                # run_fixture_build.sh prints this near the end

outputs:
  # The review bundle: small enough for the repo.
  - {remote: /workspace/stackexchange-150k-small.tgz, local: ./, extract: true}
  # The release asset: deliberately outside the repo, as arxiv-150k's is.
  - {remote: /workspace/stackexchange-150k-large.tgz,
     local: ../oneground-assets/}

# The stall watchdog: `watch` terminates if the run's log stops growing for
# this long. Every phase here logs progress -- the sampling pass prints per
# shard, embedding prints per batch -- so the longest legitimate quiet period is
# one shard streamed end to end, ~0.4-0.6 GB of column chunks. 20 minutes is the
# same value arxiv-build.yaml uses and is generous for that.
stall_minutes: 20

caps:
  # The brief's caps, not an estimate of the run. Budgeted at the TOP of the
  # live price range rather than its floor: at $0.72/hr (the rate task 006b was
  # actually billed) 1.5 hours is $1.08, inside max_usd with room for a more
  # expensive card if the cheap ones are not offered.
  #
  # What has to fit inside 1.5 hours: one streamed pass pulling ~32 GB of
  # column chunks through the reservoirs, 152k texts embedded on the GPU, exact
  # k-NN for 2,000 queries against 150k vectors, and the two reference
  # configurations. arxiv-150k did the last three in 19 minutes. The streamed
  # pass is the part with no precedent in this repo, and it is the reason this
  # is a measurement rather than a prediction -- it is bound by the pod's
  # network throughput, which `plan` cannot resolve. If the run hits the cap,
  # the report says so and says where the time went. The cap is not raised to
  # make it fit.
  max_hours: 1.5
  max_concurrent: 1
  max_usd: 2.50
