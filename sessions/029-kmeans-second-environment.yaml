# Task 029 step 4: the k-means on a second environment, under the knobs that
# move it. Creates nothing; `oneground pod up` is the only billable
# subcommand and still needs a typed 'y'.
#
# WHAT IT DECIDES. Task 027 measured 256 centroids differing by 0.00104
# between this laptop and a pod -- same faiss-cpu 1.15.0, same numpy 2.5.3,
# same seed 20260908. Locally, task 029 has since:
#
#   * DISPROVED SIMD dispatch. All four FAISS_OPT_LEVEL settings (default,
#     AVX512, AVX2, generic) give bitwise identical centroids on this laptop.
#   * ESTABLISHED that the assignment step's reduction order moves them.
#     Disabling faiss's BLAS path shifts the centroids by 0.00366 on one
#     machine, one wheel, one CPU -- larger than the cross-machine 0.00104.
#
# The leading explanation is therefore the BLAS each wheel links, and the way
# to test it is to run the same settings on the other platform and compare the
# arrays. Three outcomes, all informative:
#
#   pod default == task 027's centroids   the pod is self-consistent and 027's
#                                         finding is confirmed by a second run
#   some pod setting == this laptop's     the reduction order is the whole
#                                         story; the difference is a knob
#   none of them match                    the BLAS implementations themselves
#                                         differ, and the honest answer is to
#                                         state that centroid assignment is
#                                         per-platform and bound the effect --
#                                         a finding, not a failure, and the
#                                         developer's call
#
# It measures and brings the arrays home. It fixes nothing and decides nothing.

# CPU work: k-means is faiss-cpu and numpy. A pod needs a card and this one
# will idle; the cheapest offered in the volume's datacenter is taken.
gpu:
  - RTX PRO 4000
  - RTX PRO 4500
  - RTX A4000
  - L4

volume: vecbench                 # datacenter derived from the name
volume_mount_path: /workspace

# The image the canonical build and task 027's session used, so the
# interpreter and the pins resolve the same way. Setup builds a fresh venv
# from requirements.txt.
image: runpod/pytorch:1.1.0-cu1300-torch291-ubuntu2404

disk_gb: 20

env:
  ONEGROUND_OUT: /workspace/029-kmeans.tgz
  ONEGROUND_WORK: /workspace/oneground/runs/029-kmeans
  ONEGROUND_VECTORS: /workspace/arxiv-150k/vectors.npy

setup: corpora/POD_SETUP.md
run: bash corpora/run_029_kmeans.sh

remote_repo: /workspace/oneground
remote_log: /workspace/oneground-029.log
done_marker: DONE

# Twelve k-means over 150,000 x 768 (four dispatch levels x three BLAS
# settings). Each took 15-24 s on this 4-core laptop; a 16-vCPU host should be
# quicker, and the log prints a line per run, so ten minutes of silence would
# already be abnormal.
stall_minutes: 15

# UPLOADED: the measuring script only. The corpus is on the volume -- 460 MB
# does not go up an scp, and the `input_size_cap_mb` default of 50 stays where
# task 011 put it. `run_029_kmeans.sh` checks for the corpus in its first
# seconds and fails with the path rather than after twenty minutes.
inputs:
  - local: tasks/scratch/029_pod_kmeans.py
    remote: /workspace/oneground/tasks/scratch/029_pod_kmeans.py
    optional: false

outputs:
  # Raw centroid arrays plus a manifest and the host's CPU description. Twelve
  # arrays of 256 x 768 float32 = 9.4 MB before compression.
  - remote: /workspace/029-kmeans.tgz
    local: runs/029-kmeans-pod/
    extract: true

caps:
  # Twelve k-means, no index build, no embedding. Task 027's session did more
  # than this and finished in 2.9 minutes of compute after a 3.4-minute setup.
  # An hour is generous, and the cap is confirmed at the TOP of the live price
  # range rather than its floor.
  max_hours: 1.0
  max_concurrent: 1
  max_usd: 2.0
